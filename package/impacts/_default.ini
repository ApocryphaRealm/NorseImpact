; NorseImpact default rules (2026-11-17): blood from the game's own blood pack on every hit, and a short hit-stop.
[Blood on every hit]
On = UnitDamaged
When = InFight          ; not the game setting a unit up at map load (first test: blood before the fight)
MinDamage = 1
Effect = /Game/Norse/Effects/Blood/FXVillesBloodVFXPack/Particles/Niagara/Real/NS_Blood_Slice.NS_Blood_Slice
EffectZ = 40
HitStop = 0.05

[A burst on a killing blow]
On = UnitDied
When = InFight
Effect = /Game/Norse/Effects/Blood/FXVillesBloodVFXPack/Particles/Niagara/Real/NS_Blood_Burst_Omni.NS_Blood_Burst_Omni
EffectZ = 30
; SlowMo = 0.35, 0.6     ; slow motion on a kill - off by default
